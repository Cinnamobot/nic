[project]
name = "nic"
version = "0.1.0"
description = "Niigata Information Connector (NIC)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "mcp>=1.2,<2",
]

[project.scripts]
# Windows コンソールでの文字化け対策のため、エントリポイントで
# sys.stdout.reconfigure(encoding="utf-8") を実行するラッパーを経由する。
ngt = "nic.cli.main:run"
ngt-mcp = "nic.mcp.server:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
